{% extends "base.html" %}
{% block title %}Sign in · Orchestrator ACME Cert Manager{% endblock %}
{% block content %}
  {% import "_macros.html" as m with context %}
  <div class="auth-wrap">
    <div class="panel auth-card">
      <h1>Sign in</h1>
      {% if error %}<div class="errors">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('login') }}" autocomplete="off">
        {{ m.csrf() }}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field"><label for="username">Username</label><input id="username" name="username" autofocus></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"></div>
        <div class="form-actions"><button type="submit" class="btn">Sign in</button></div>
      </form>
    </div>
  </div>
{% endblock %}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "B904", "B905", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E701", "E702", "B011", "B017"]

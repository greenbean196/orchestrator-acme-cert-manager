version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /                 # Dockerfile base image
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /                 # smallstep/step-ca pin; our own image tag is owned by scripts/check-version.py
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "ghcr.io/robertsonc/orchestrator-acme-cert-manager"
  - package-ecosystem: github-actions
    directory: /                 # SHA-pinned actions; Dependabot keeps the pin and the version comment
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
